[package]
name = "config-space-manager-esp-nvs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "ESP NVS backend for config-space-manager"
repository = "https://github.com/iobewi/config-space-manager"
keywords = ["embedded", "configuration", "esp32", "nvs", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = []
esp32c3 = ["espbewi-nvs/esp32c3"]
esp32s3 = ["espbewi-nvs/esp32s3"]

[dependencies]
config-space-manager = { path = "../.." }
espbewi-flash = { git = "https://github.com/iobewi/espbewi", rev = "0b11f035d1aed6d901adca2098c6efc29a2cee83", package = "espbewi-flash" }
espbewi-nvs = { git = "https://github.com/iobewi/espbewi", rev = "0b11f035d1aed6d901adca2098c6efc29a2cee83", package = "espbewi-nvs" }
esp-nvs = "0.5.0"
log = { version = "0.4.29", default-features = false }
