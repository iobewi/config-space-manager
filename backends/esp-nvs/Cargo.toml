[package]
name = "config-space-manager-esp-nvs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "ESP NVS backend for config-space-manager"
repository = "https://github.com/iobewi/config-space-manager"
keywords = ["embedded", "configuration", "esp32", "nvs", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = []
esp32c3 = ["esp-storage-manager/esp32c3"]
esp32s3 = ["esp-storage-manager/esp32s3"]

[dependencies]
config-space-manager = { path = "../.." }
esp-storage-manager = { git = "https://github.com/iobewi/esp-storage-manager", rev = "d311937", default-features = false }
embassy-sync = "0.8.0"
